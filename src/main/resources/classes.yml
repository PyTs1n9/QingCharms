# QingCharms 职业与构筑规则配置。
# 本文件由插件启动时自动生成；config.yml 不再管理职业（classes）与构筑（rules）。
# 修改本文件后执行 /qc reload 使其生效。

# 职业只通过权限节点判断。GroupManager 负责分配权限；QingCharms 只调用 hasPermission()。
# 职业 tags 不参与构筑词条计数；饰品词条写在 charms.<id>.tags，构筑写在 builds.yml。
# recommended-tags 只用于职业推荐展示，不参与构筑判定。
classes:
  paladin:
    name: "圣骑士"
    permission: "deluxetags.tag.sqs"
    tags: [圣光, 守护]
    recommended-tags: [圣光, 守护, 治疗]
  warrior:
    name: "战士"
    permission: "deluxetags.tag.warrior"
    tags: [力量, 壁垒]
    recommended-tags: [力量, 壁垒, 物理]

# 兼容迁移区：本文件中的旧 rules 已不再计算，内容保留供管理员参考。
# 请按 docs/plugin-boundaries.md 的新格式迁移到 builds.yml。
rules:
  holy-bond:
    enabled: false
    name: "圣光祝福"
    tags: [圣光]
    count: 2
    add-lore:
      - "&f防御: +5%"
  holy-bond-pro:
    enabled: false
    name: "超级圣光祝福"
    tags: [圣光]
    count: 5
    add-lore:
      - "&f防御: +15%"
  holy-guard-bond:
    enabled: false
    name: "圣光守护"
    tags: [圣光, 守护]
    count: 4
    add-lore:
      - "&f伤害减免: +5%"
  paladin-build:
    enabled: false
    name: "黎明守卫"
    classes: [paladin]
    tags: [守护]
    count: 2
    add-lore:
      - "&f生命: +5%"
