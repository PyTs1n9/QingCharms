# QingCharms 构筑配置。
# 每个已装备饰品对其 tags 中每个不同词条贡献 1 次。
# condition 中所有条件均需满足；匹配的多个构筑同时生效。
# attribute 为交给 ILS 解析的完整 Lore 行，不在 QingCharms 内解析数值。
builds: {}
