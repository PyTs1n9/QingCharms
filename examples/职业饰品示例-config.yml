# ============================================================
#  QingCharms 职业饰品示例 ——「圣辉誓约」（圣骑士专属项链）
#  目标文件：plugins/QingCharms/config.yml
#  用法：把下面 3 段内容分别粘到 config.yml 里同名的顶层节点下面。
#        如果 config.yml 里已经有 classes: / rules: / charms:，
#        只粘「子项」，不要重复写顶层键名。
#  改完执行：/qc reload
# ============================================================


# ------------------------------------------------------------
#  第 1 段：职业定义（粘到 classes: 下面）
#  「职业」在本插件里只有一个判断依据：玩家有没有这个权限节点。
#  权限由权限组插件（GroupManager / LuckPerms / DeluxeTags）分配，
#  QingCharms 自己不做职业系统。
# ------------------------------------------------------------
classes:
  paladin:
    name: "圣骑士"                        # 界面上显示的职业名
    permission: "deluxetags.tag.sqs"      # ★ 有该权限 = 这个职业
    tags: [圣光, 守护]                    # ★ 构筑标签的唯一来源，下面 rules 只认这里的标签
    recommended-tags: [圣光, 守护, 治疗]   # 只用于 /qc build 的推荐提示，不参与判定
    titles: ["黎明守卫"]                  # 可选，纯展示用的称号


# ------------------------------------------------------------
#  第 2 段：构筑规则 / 职业词条（粘到 rules: 下面）
#  规则 = "凑够条件就白送几行 Lore 给 ILS 去算属性"。
#
#  ★ 只有 bond（羁绊）一种算法，不用写 type。
#  ★ 计数方式：GUI 内每件已装备饰品，都会把职业的每个 tags 各计 1 次。
#     圣骑士 tags: [圣光, 守护]，装 3 件 → 圣光 = 3，守护 = 3。
#     所以单标签时 count 就等于「需要装备几件」。
#  ★ 档位：tags 组合相同的规则互相竞争，只亮 count 最高的那条。
#     下面 A(count 2) 和 B(count 4) 都是 tags: [圣光] →
#       装 2~3 件只亮 A；装 4 件起只亮 B，A 不会跟着一起叠。
#  ⚠️ rules 下的 enabled 默认是 true，要关掉必须显式写 false。
# ------------------------------------------------------------
rules:
  # 词条 A：装 2 件就能吃到的入门羁绊
  holy-bond-2:
    enabled: true
    name: "圣光初鸣"                      # /qc build 里显示的名字
    tags: [圣光]
    count: 2                              # 装备 2 件（职业带圣光）
    add-lore:
      - "&f防御: +5%"

  # 词条 B：装 4 件的进阶羁绊（和 A 同档，装了 4 件就把 A 顶掉）
  holy-bond-4:
    enabled: true
    name: "圣光共鸣"
    tags: [圣光]
    count: 4                              # 装备 4 件
    add-lore:                             # 生效后追加的 Lore（必须写成 ILS 认的格式）
      - "&f攻击力: +8%"

  # 词条 C：限定职业 + 装 3 件（classes 是可选门槛，不写则不限职业）
  paladin-guard:
    enabled: true
    name: "黎明守卫"
    classes: [paladin]                    # 只有圣骑士吃得到
    tags: [守护]
    count: 3                              # 装备 3 件
    add-lore:
      - "&f生命: +5%"


# ------------------------------------------------------------
#  第 3 段：饰品本体（粘到 charms: 下面）
#  ⚠️ charms 下的 enabled 默认是 false，不写 true 就不会加载！
# ------------------------------------------------------------
charms:
  paladin-oath-necklace:
    enabled: true                         # ★ 必须写 true
    material: 95                          # 材质：数字 ID 或 Bukkit 名（95=染色玻璃）
    data: 14                              # 变体值：14=红色。不写则不校验颜色
    display-name: "&e圣辉誓约"             # 显示名，参与识别，必须和实际物品一致
    lore:
      - "&7项链护符"                       # 稳定锚点行 1
      - "&8[护符槽位: 项链]"               # 稳定锚点行 2（同时是装备凭证）
      - "&d职业: 圣骑士"                   # 职业词条（纯展示，不参与判定）
      - "&f攻击力: &c+12"                  # ★ 真正的属性行：交给 ILS 去算
      - "&f生命值: &c+25"                  # ★ 真正的属性行：交给 ILS 去算
    type: 项链                             # ★ 必须和 gui.yml 里某个槽位的 type 一模一样
    equip-lore: "&8[护符槽位: 项链]"       # ★ 装备凭证行，必须整行出现在物品 Lore 里
    rarity: EPIC                          # COMMON / RARE / EPIC / LEGENDARY
    category: 项链                         # 背包分类（不写 = 等于 type）
    level: 10                             # 展示等级（背包排序用，不是门槛）
    source-description: "圣骑士专属，深渊守卫掉落或青玉商店兑换。"
    permission: qingcharms.charm.paladin-oath-necklace
    # 注意：饰品不再写 tags。构筑标签只来自 classes.<id>.tags
    requirements:
      player-level: 10                    # 装备门槛：玩家原版等级 ≥ 10
      classes: [paladin]                  # ★ 职业门槛：只允许圣骑士装备
